name: Build APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The native build uses the host clang for emugen (HOST_CMAKE_C_COMPILER
      # in app/src/main/cpp/CMakeLists.txt) and autotools for talloc and
      # libunwind, so install them on the runner.
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld autoconf automake libtool bison flex pkg-config

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # setup-android v3 defaults to "tools platform-tools", but the
          # "tools" package no longer exists in the SDK repository.
          packages: 'platform-tools'

      - name: Install CMake, NDK and SDK components
        run: sdkmanager --install "cmake;3.22.1" "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Cache Boost and Gradle
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/boost
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ananbox-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ananbox-

      # cmake/Boost.cmake only downloads boost when app/src/main/cpp/boost is
      # missing, and that download-and-rename path fails on a cold build, so
      # lay out boost here instead.
      - name: Prepare Boost
        run: |
          set -euo pipefail
          boost_dir=app/src/main/cpp/boost
          if [ -f "$boost_dir/libs/algorithm/CMakeLists.txt" ]; then
            echo "Boost already present, skipping download"
            exit 0
          fi
          rm -rf "$boost_dir"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/boost-1.83.0.tar.xz" \
            https://github.com/boostorg/boost/releases/download/boost-1.83.0/boost-1.83.0.tar.xz
          echo "c5a0688e1f0c05f354bbd0b32244d36085d9ffc9f932e8a18983a9908096f614  $RUNNER_TEMP/boost-1.83.0.tar.xz" | sha256sum -c -
          mkdir -p app/src/main/cpp
          tar -xJf "$RUNNER_TEMP/boost-1.83.0.tar.xz" -C app/src/main/cpp --strip-components=1 \
            --one-top-level=boost

      # proot's GNUmakefile builds its Python extension whenever swig and
      # python3-config are present. It then picks up the runner's host Python
      # (3.14) headers, which do not work with the NDK toolchain, so keep the
      # Python bindings out of the build. The proot binary target is unchanged.
      - name: Hide swig from the proot build
        run: |
          swig_path="$(command -v swig || true)"
          if [ -n "$swig_path" ]; then
            echo "swig found at $swig_path, removing it from the build PATH"
            sudo rm -f "$swig_path"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The "proot" target (app/src/main/cpp/cmake/Proot.cmake) is part of the
      # default build, so it is built and packaged here as well.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ananbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
