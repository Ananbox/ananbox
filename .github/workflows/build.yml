name: Build APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The native build uses the host clang for emugen (HOST_CMAKE_C_COMPILER
      # in app/src/main/cpp/CMakeLists.txt), so install it on the runner.
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android's default cmdline-tools version (22.0) fails on the
      # runner, and its version numbers must be the long form (the zip name).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          log-accepted-android-sdk-licenses: false

      - name: Install CMake, NDK and SDK components
        run: sdkmanager --install "cmake;3.22.1" "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Cache Boost and Gradle
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/cpp/boost
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ananbox-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ananbox-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The "proot" target (app/src/main/cpp/cmake/Proot.cmake) is part of the
      # default build, so it is built and packaged here as well.
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ananbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
